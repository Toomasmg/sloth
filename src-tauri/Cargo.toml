[package]
name = "sloth"
version = "0.8.0"
edition = "2021"
publish = false

[lib]
name = "sloth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
trash = "5"
# Misma versión que native/core (bajada del modelo de dictado).
ureq = { version = "2", default-features = false, features = ["tls"] }
webview2-com = "0.39"
png = "0.17"
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Time"] }
tokio = { version = "1", features = ["sync", "rt", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Misma versión que usa native/core: con un target común las dependencias se compilan una sola vez.
sloth-core = { path = "../native/core" }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
