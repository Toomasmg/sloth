name: Celu web

# Publica la página del celu (PWA) en GitHub Pages: https://toomasmg.github.io/sloth/celu/
on:
  push:
    branches: [main]
    paths:
      - 'src/celu-web/**'
      - 'src/main/features/celular-pagina.ts'
      - 'src/shared/celu-remoto.ts'
      - 'scripts/build-celu-web.mjs'
      - 'package-lock.json'
      - '.github/workflows/celu-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:celu-web
      # La URL pública termina en /sloth/celu/: el sitio lleva la carpeta celu adentro.
      - run: |
          mkdir -p out/pages
          cp -r out/celu-web out/pages/celu
          touch out/pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages
      - id: deploy
        uses: actions/deploy-pages@v4
