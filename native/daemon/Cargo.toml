[package]
name = "sloth-daemon"
version = "0.8.0"
edition = "2021"
publish = false

[dependencies]
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
subtle = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
