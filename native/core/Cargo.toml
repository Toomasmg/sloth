[package]
name = "sloth-core"
version = "0.8.0"
edition = "2021"
publish = false

# Lógica de Sloth que no depende de Tauri: persistencia, store, hooks, permisos, features. Se prueba sola
# (cargo test) y la usa la cáscara de src-tauri. Es el reemplazo, módulo a módulo, de src/main (ver docs/migracion-rust.md).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"
base64 = "0.22"
regex = "1"
unicode-segmentation = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
