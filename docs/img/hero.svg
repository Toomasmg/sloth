<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11141C"/><stop offset=".6" stop-color="#1C1F29"/><stop offset="1" stop-color="#0E1A1D"/></linearGradient>
  <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9FEAF9"/><stop offset="1" stop-color="#47848F"/></linearGradient>
  <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9FEAF9"><animate attributeName="stop-color" values="#9FEAF9;#47848F;#9FEAF9" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#47848F"><animate attributeName="stop-color" values="#47848F;#9FEAF9;#47848F" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="brillo"><stop offset="0" stop-color="#47848F" stop-opacity=".45"/><stop offset="1" stop-color="#47848F" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .titulo{font:800 84px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;letter-spacing:-2px}
  .sub{font:500 22px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#E2E8F0}
  .tag{font:700 12px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#7C8799;letter-spacing:3px}
  .nombre{font:600 15px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#E6E9EF}
  .cuenta{font:500 12px 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#7C8799}
  .pill{font:600 12px 'Segoe UI', Inter, Helvetica, Arial, sans-serif}
  .entra{opacity:0;animation:entra 1s ease forwards}
  .panel{opacity:0;animation:entra .9s ease forwards}
  @keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .orbita{animation:gira 14s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo 4s ease-in-out infinite}
  @keyframes halo{50%{transform:scale(1.12);opacity:.7}}
  .cursor{animation:parpadea 1.1s steps(1) infinite}
  @keyframes parpadea{50%{opacity:0}}
  .est{opacity:0;animation:9s linear infinite}
  .est0{animation-name:e0}.est1{animation-name:e1}.est2{animation-name:e2}
  @keyframes e0{0%,30%{opacity:1}33.3%,100%{opacity:0}}
  @keyframes e1{0%,33.3%{opacity:0}36.6%,63%{opacity:1}66.6%,100%{opacity:0}}
  @keyframes e2{0%,66.6%{opacity:0}70%,97%{opacity:1}100%{opacity:0}}
  .latido{transform-box:fill-box;transform-origin:center;animation:latido 1.2s ease-in-out infinite}
  @keyframes latido{50%{transform:scale(.55)}}
  .linea{animation:escribe 3s ease-in-out infinite alternate}
  @keyframes escribe{from{opacity:.35}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.est0,.panel,.entra{opacity:1}}
</style>
<rect width="1200" height="360" rx="24" fill="url(#fondo)"/>
<circle cx="131" cy="150" r="120" fill="url(#brillo)" class="halo"/>
<g transform="translate(73 92) scale(3.6)">
  <g class="orbita" style="transform-origin:16px 16px">
    <ellipse cx="16" cy="16" rx="13" ry="5.2" transform="rotate(-30 16 16)" fill="none" stroke="url(#marca)" stroke-width="1.4"/>
    <circle cx="27.3" cy="9.5" r="1.7" fill="#9FEAF9"/>
  </g>
  <g class="orbita" style="transform-origin:16px 16px">
    <ellipse cx="16" cy="16" rx="13" ry="5.2" transform="rotate(30 16 16)" fill="none" stroke="url(#marca)" stroke-width="1.4"/>
    <circle cx="4.7" cy="9.5" r="1.7" fill="#47848F"/>
  </g>
  <rect x="10.5" y="10.5" width="11" height="11" rx="3" fill="#1C1F29" stroke="url(#marca)" stroke-width="1.2"/>
  <path d="M14 14l2.6 2-2.6 2" fill="none" stroke="#9FEAF9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17.6 18.6h2" fill="none" stroke="#9FEAF9" stroke-width="1.5" stroke-linecap="round" class="cursor"/>
</g>
<text x="262" y="175" class="titulo entra" fill="url(#titulo)">Sloth</text>
<text x="66" y="262" class="sub entra" style="animation-delay:.35s">Varias cuentas de Claude Code a la vez,</text>
<text x="66" y="292" class="sub entra" style="animation-delay:.5s">cada una en su terminal y su repo.</text>
<text x="66" y="328" class="tag entra" style="animation-delay:.8s">APP DE ESCRITORIO PARA WINDOWS · LIVIANA A PROPÓSITO</text>
<g class="panel" style="animation-delay:0.30s">
  <rect x="640" y="46" width="520" height="84" rx="12" fill="#161922" stroke="#2A3040"/>
  <rect x="640" y="56" width="3" height="64" rx="1.5" fill="url(#marca)"/>
  <text x="662" y="75" class="nombre">web</text>
  <text x="696" y="75" class="cuenta">Personal</text>
  <rect x="662" y="90" width="210" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:0.0s"/><rect x="662" y="102" width="150" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:0.5s"/><rect x="662" y="114" width="180" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:1.0s"/>
  <g class="est est0" style="animation-delay:0.0s"><rect x="1020" y="58" width="124" height="24" rx="12" fill="#8AB4FF" fill-opacity=".14" stroke="#8AB4FF" stroke-opacity=".5"/><circle cx="1036" cy="70" r="4" fill="#8AB4FF" class="latido"/><text x="1048" y="74.5" fill="#8AB4FF" class="pill">Trabajando</text></g><g class="est est1" style="animation-delay:0.0s"><rect x="1020" y="58" width="124" height="24" rx="12" fill="#F5B96B" fill-opacity=".14" stroke="#F5B96B" stroke-opacity=".5"/><circle cx="1036" cy="70" r="4" fill="#F5B96B"/><text x="1048" y="74.5" fill="#F5B96B" class="pill">Te necesita</text></g><g class="est est2" style="animation-delay:0.0s"><rect x="1020" y="58" width="124" height="24" rx="12" fill="#6FD3A0" fill-opacity=".14" stroke="#6FD3A0" stroke-opacity=".5"/><circle cx="1036" cy="70" r="4" fill="#6FD3A0"/><text x="1048" y="74.5" fill="#6FD3A0" class="pill">Terminó</text></g>
</g>
<g class="panel" style="animation-delay:0.55s">
  <rect x="640" y="144" width="520" height="84" rx="12" fill="#161922" stroke="#2A3040"/>
  <rect x="640" y="154" width="3" height="64" rx="1.5" fill="url(#marca)"/>
  <text x="662" y="173" class="nombre">api-pagos</text>
  <text x="744" y="173" class="cuenta">Trabajo</text>
  <rect x="662" y="188" width="150" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:-1.0s"/><rect x="662" y="200" width="180" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:-0.5s"/><rect x="662" y="212" width="210" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:0.0s"/>
  <g class="est est0" style="animation-delay:-2.4s"><rect x="1020" y="156" width="124" height="24" rx="12" fill="#8AB4FF" fill-opacity=".14" stroke="#8AB4FF" stroke-opacity=".5"/><circle cx="1036" cy="168" r="4" fill="#8AB4FF" class="latido"/><text x="1048" y="172.5" fill="#8AB4FF" class="pill">Trabajando</text></g><g class="est est1" style="animation-delay:-2.4s"><rect x="1020" y="156" width="124" height="24" rx="12" fill="#F5B96B" fill-opacity=".14" stroke="#F5B96B" stroke-opacity=".5"/><circle cx="1036" cy="168" r="4" fill="#F5B96B"/><text x="1048" y="172.5" fill="#F5B96B" class="pill">Te necesita</text></g><g class="est est2" style="animation-delay:-2.4s"><rect x="1020" y="156" width="124" height="24" rx="12" fill="#6FD3A0" fill-opacity=".14" stroke="#6FD3A0" stroke-opacity=".5"/><circle cx="1036" cy="168" r="4" fill="#6FD3A0"/><text x="1048" y="172.5" fill="#6FD3A0" class="pill">Terminó</text></g>
</g>
<g class="panel" style="animation-delay:0.80s">
  <rect x="640" y="242" width="520" height="84" rx="12" fill="#161922" stroke="#2A3040"/>
  <rect x="640" y="252" width="3" height="64" rx="1.5" fill="url(#marca)"/>
  <text x="662" y="271" class="nombre">docs</text>
  <text x="704" y="271" class="cuenta">Personal</text>
  <rect x="662" y="286" width="180" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:-2.0s"/><rect x="662" y="298" width="210" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:-1.5s"/><rect x="662" y="310" width="150" height="5" rx="2.5" fill="#3A4152" class="linea" style="animation-delay:-1.0s"/>
  <g class="est est0" style="animation-delay:-4.8s"><rect x="1020" y="254" width="124" height="24" rx="12" fill="#8AB4FF" fill-opacity=".14" stroke="#8AB4FF" stroke-opacity=".5"/><circle cx="1036" cy="266" r="4" fill="#8AB4FF" class="latido"/><text x="1048" y="270.5" fill="#8AB4FF" class="pill">Trabajando</text></g><g class="est est1" style="animation-delay:-4.8s"><rect x="1020" y="254" width="124" height="24" rx="12" fill="#F5B96B" fill-opacity=".14" stroke="#F5B96B" stroke-opacity=".5"/><circle cx="1036" cy="266" r="4" fill="#F5B96B"/><text x="1048" y="270.5" fill="#F5B96B" class="pill">Te necesita</text></g><g class="est est2" style="animation-delay:-4.8s"><rect x="1020" y="254" width="124" height="24" rx="12" fill="#6FD3A0" fill-opacity=".14" stroke="#6FD3A0" stroke-opacity=".5"/><circle cx="1036" cy="266" r="4" fill="#6FD3A0"/><text x="1048" y="270.5" fill="#6FD3A0" class="pill">Terminó</text></g>
</g>
</svg>
